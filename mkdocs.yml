# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: OpenML Server
site_url: https://openml.github.io/server-api

repo_name: openml/server-api
repo_url: https://github.com/openml/server-api

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.tabs

nav:
  - OpenML Server:
      - index.md
      - Migration Guide: migration.md
      - Roadmap: roadmap.md
  - Deployment:
      - installation.md
  - Development:
      - Setup: contributing/setup.md
      - Tests: contributing/tests.md
      - Project Overview: contributing/project_overview.md
      - Database:
        - database/index.md
        - openml: database/openml.md
        - openml_expdb: database/openml_expdb.md
  - Contributing:
      - contributing/index.md
      - Documentation: contributing/documentation.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - tables

plugins:
  - search
  - section-index
